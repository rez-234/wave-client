name: mod

on:
  push:
    paths:
      - 'mod/**'
      - '.github/workflows/mod.yml'
  pull_request:
    paths:
      - 'mod/**'
      - '.github/workflows/mod.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mod
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ./gradlew build --console=plain
      - name: Upload mod jar
        uses: actions/upload-artifact@v7
        with:
          name: waveclient-mod
          path: mod/build/libs/
      # Dev-only check that runs last, so a Modrinth outage can't cost the build artifact.
      - name: Check compat mods resolve (Sodium, Lithium, Iris and Iris's libraries)
        run: ./gradlew resolveRuntimeClasspath compileJava -Pcompat --console=plain
