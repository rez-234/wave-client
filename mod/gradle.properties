org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric (https://fabricmc.net/develop)
minecraft_version=1.21.11
loader_version=0.19.5
# Loom 1.17 runs on JDK 21; Loom 1.18+ needs JDK 25 to run Gradle.
loom_version=1.17-SNAPSHOT
fabric_api_version=0.141.6+1.21.11

# Mod
mod_version=0.3.0
maven_group=dev.waveclient
archives_base_name=waveclient

# Tests
junit_version=5.14.4

# Dev-only compat runtime: ./gradlew runClient -Pcompat
# Coordinates are maven.modrinth:<slug>:<Modrinth version number>.
# Sodium and Iris are version-locked (Sodium 0.8.13+ breaks Iris <= 1.10.7): always bump them together.
sodium_version=mc1.21.11-0.8.14-fabric
lithium_version=mc1.21.11-0.21.4-fabric
iris_version=1.10.8+1.21.11-fabric
# Libraries Iris bundles inside its jar. Loom doesn't load bundled jars in dev, so they're added
# explicitly. Versions from Iris's fabric/build.gradle.kts; re-check on every Iris bump.
iris_antlr4_runtime_version=4.13.1
iris_glsl_transformer_version=3.0.0-pre3
iris_jcpp_version=1.4.14
