plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Only consulted for maven.modrinth artifacts, which are only requested with -Pcompat,
	// so normal builds never contact Modrinth.
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

// ./gradlew runClient -Pcompat loads Sodium, Lithium, Iris and Mod Menu alongside the mod.
// -Pcompat=false (or no flag) leaves them out.
def compatRuntime = providers.gradleProperty('compat')
		.map { it.isEmpty() || it.toBoolean() }
		.getOrElse(false)

sourceSets {
	// Compile-time stand-ins for Mod Menu's API (see ModMenuApi.java), so builds never need to
	// download Mod Menu. On the compile classpath only: not in the jar, not at runtime.
	modmenuApi {
		compileClasspath += main.compileClasspath
	}
	main {
		compileClasspath += modmenuApi.output
	}
	// The client game test CI boots the game with. A mod of its own, never in the release jar.
	gametest {
		compileClasspath += main.compileClasspath + main.output
		runtimeClasspath += main.runtimeClasspath + main.output
	}
}

loom {
	mods {
		"waveclient" {
			sourceSet sourceSets.main
		}
		"waveclient-gametest" {
			sourceSet sourceSets.gametest
		}
	}

	runs {
		// ./gradlew runClientGameTest starts the game, runs WaveClientGameTest and exits; a failed
		// check fails the task. Needs a display: CI runs it under xvfb.
		clientGameTest {
			client()
			name = 'Client Game Test'
			source sourceSets.gametest
			vmArg '-Dfabric.client.gametest'
			// As Fabric API's own CI: with packet tracking on, joining the test world stalled in
			// most CI runs. The test waits several ticks after every server command instead.
			vmArg '-Dfabric.client.gametest.disableNetworkSynchronizer=true'
			runDir 'build/clientgametest'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	if (compatRuntime) {
		modLocalRuntime "maven.modrinth:sodium:${project.sodium_version}"
		modLocalRuntime "maven.modrinth:lithium:${project.lithium_version}"
		modLocalRuntime "maven.modrinth:iris:${project.iris_version}"
		modLocalRuntime "maven.modrinth:modmenu:${project.modmenu_version}"
		// transitive = false matches exactly what Iris bundles; their POMs would otherwise pull in
		// the full ANTLR tool and old slf4j/ant versions.
		localRuntime "org.antlr:antlr4-runtime:${project.iris_antlr4_runtime_version}"
		localRuntime("io.github.douira:glsl-transformer:${project.iris_glsl_transformer_version}") { transitive = false }
		localRuntime("org.anarres:jcpp:${project.iris_jcpp_version}") { transitive = false }
	}

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	def props = [version: project.version, minecraft_version: project.minecraft_version, loader_version: project.loader_version]
	inputs.properties props

	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

test {
	useJUnitPlatform()
	// ThemeTokensTest reads the shared design tokens, so editing them must re-run the tests.
	inputs.file(layout.projectDirectory.file('../shared/design-tokens.json'))
			.withPropertyName('designTokens')
			.withPathSensitivity(PathSensitivity.NONE)
}

// CI runs this with -Pcompat so a wrong coordinate for any dev-runtime library fails the build.
// (Loom resolves the mod* configurations itself, but plain localRuntime libraries only at runClient.)
tasks.register('resolveRuntimeClasspath') {
	description = 'Resolves runtimeClasspath, including the -Pcompat libraries.'
	def runtime = files(configurations.runtimeClasspath)
	inputs.files(runtime)
	doLast {
		logger.lifecycle("runtimeClasspath resolved: ${runtime.files.size()} files")
	}
}
